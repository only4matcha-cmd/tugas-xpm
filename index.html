<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Tugas Kelas X-PM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tombol Menu Garis Tiga di Pojok Kiri Atas -->
    <button id="btnMenu" class="btn-menu">☰</button>

    <!-- Menu Samping (Dropdown / Drawer) -->
    <div id="sideMenu" class="side-menu">
        <button id="btnCloseMenu" class="btn-close">×</button>
        <h3>Menu Pengaturan</h3>
        <button id="btnDarkMode" class="menu-item-btn">🌙 Mode Gelap</button>
    </div>
    <div id="menuOverlay" class="menu-overlay"></div>

    <div class="container">
        <h1>📚 Tugas Kelas X-PM</h1>
        
        <!-- Bagian Input Admin (Tersembunyi Default) -->
        <div id="adminSection" class="input-section" style="display: none;">
            <h3>Panel Admin Tambah Tugas</h3>
            <input type="text" id="inputMapel" placeholder="Nama Mapel (Cth: Matematika)">
            <textarea id="inputTugas" placeholder="Keterangan tugas atau soal..."></textarea>
            <input type="text" id="inputGambar" placeholder="Link Gambar Soal (Opsional, Boleh dikosongkan)">
            <button id="btnTambah">Simpan Tugas</button>
        </div>

        <!-- Tombol Login Admin -->
        <button id="btnLoginAdmin" class="btn-admin">Masuk Sebagai Admin</button>

        <!-- Daftar Mapel Dinamis -->
        <div id="containerMapel">
            <p id="loadingText" style="text-align:center; color:#888;">Memuat daftar tugas...</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
