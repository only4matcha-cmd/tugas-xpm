<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Tugas Kelas X-PM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
</head>
<body>

    <!-- Tombol Menu Garis Tiga (Sidebar) -->
    <button id="btnMenu" class="btn-menu">☰</button>

    <!-- Menu Samping (Sidebar) -->
    <div id="sideMenu" class="side-menu">
        <button id="btnCloseMenu" class="btn-close">×</button>
        <h3>⚙️ Menu Pengaturan</h3>
        <button id="btnDarkMode" class="menu-item-btn">🌙 Mode Gelap</button>
        <button id="btnNotif" class="menu-item-btn">🔕 Notifikasi: OFF</button>
    </div>
    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- Kotak Pop-up Sandi Admin Custom -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Masukkan Sandi Admin</h3>
            <p>Masukkan sandi untuk masuk ke mode admin.</p>
            <input type="password" id="inputPassword" placeholder="Kata sandi...">
            <div class="modal-buttons">
                <button id="btnCancelPassword" class="btn-cancel">Batal</button>
                <button id="btnSubmitPassword" class="btn-submit">Masuk</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>📚 Tugas Kelas X-PM</h1>
        
        <!-- Bagian Input Admin (Tersembunyi Default) -->
        <div id="adminSection" class="input-section" style="display: none;">
            <h3>Panel Admin Tambah Tugas</h3>
            <input type="text" id="inputMapel" placeholder="Nama Mapel (Cth: Matematika)">
            <textarea id="inputTugas" placeholder="Keterangan tugas atau soal..."></textarea>
            <input type="text" id="inputGambar" placeholder="Link Gambar Soal (Opsional, Boleh dikosongkan)">
            <button id="btnTambah">Simpan Tugas</button>
        </div>

        <!-- Tombol Login Admin -->
        <button id="btnLoginAdmin" class="btn-admin">Masuk Sebagai Admin</button>

        <!-- Daftar Mapel Dinamis -->
        <div id="containerMapel">
            <p id="loadingText" style="text-align:center; color:#888;">Memuat daftar tugas...</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
