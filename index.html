<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas X-PM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>

    <!-- Tombol Menu Kiri Atas -->
    <button id="btnMenu" class="btn-menu">☰</button>

    <!-- Overlay & Side Menu -->
    <div id="menuOverlay" class="menu-overlay"></div>
    <div id="sideMenu" class="side-menu">
        <div class="side-menu-header">
            <h3>Menu Utama</h3>
            <button id="btnCloseMenu" class="btn-close">✕</button>
        </div>
        <div class="side-menu-body">
            <button id="btnDarkMode" class="menu-item">🌙 Mode Gelap</button>
            <button id="btnWaReminder" class="menu-item">📱 Ingatkan Saya via WA</button>
            <button id="btnChangePassword" class="menu-item">🔑 Ubah Sandi Admin</button>
            <button id="btnLoginAdmin" class="menu-item admin-btn">Masuk Sebagai Admin</button>
        </div>
    </div>

    <!-- Konten Utama -->
    <div class="container">
        <h1>Tugas Kelas X-PM</h1>

        <!-- Panel Admin (Tersembunyi Awalnya) -->
        <div id="adminSection" class="admin-panel" style="display: none;">
            <h3>Panel Admin</h3>
            <input type="text" id="inputMapel" placeholder="Nama Mata Pelajaran">
            <textarea id="inputTugas" placeholder="Keterangan Tugas"></textarea>
            <input type="text" id="inputGambar" placeholder="Link Gambar (Opsional)">
            <button id="btnTambah">Posting Tugas</button>
        </div>

        <!-- Daftar Tugas -->
        <div id="containerMapel"></div>
    </div>

    <!-- Modal Password Admin -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>Masukkan Sandi Admin</h3>
            <input type="password" id="inputPassword" placeholder="Sandi...">
            <div class="modal-buttons">
                <button id="btnSubmitPassword">Masuk</button>
                <button id="btnCancelPassword">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Ubah Sandi -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <h3>Ubah Sandi Admin</h3>
            <input type="password" id="inputOldPassword" placeholder="Sandi Lama">
            <input type="password" id="inputNewPassword" placeholder="Sandi Baru">
            <div class="modal-buttons">
                <button id="btnSubmitNewPassword">Simpan</button>
                <button id="btnCancelChangePassword">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Input Nomor WhatsApp -->
    <div id="waModal" class="modal">
        <div class="modal-content">
            <h3>Atur Pengingat WhatsApp</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Masukkan nomor WA kamu (format: 628xxxxxxxxxx) agar tombol kirim tugas otomatis mengarah ke nomor ini.</p>
            <input type="text" id="inputWaNumber" placeholder="Contoh: 6281234567890">
            <div class="modal-buttons">
                <button id="btnSubmitWa">Simpan</button>
                <button id="btnCancelWa">Batal</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
